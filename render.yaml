# Render Blueprint: Render 대시보드 > New > Blueprint 에서 이 저장소를 고르면 아래 설정으로 배포된다.
# SUPABASE_URL, SUPABASE_ANON_KEY 는 비밀값이라 여기 적지 않고, 배포할 때 화면에서 입력한다.
services:
  - type: web
    name: my-todo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PROVIDER
        value: supabase
      - key: TRUST_PROXY
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
