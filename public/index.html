<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 로그인 화면 (Supabase 모드에서만 사용) -->
  <section class="auth" id="auth-view" hidden>
    <form class="auth-card" id="auth-form" autocomplete="on">
      <h1 class="auth-title">My Todo</h1>
      <p class="auth-subtitle">로그인하면 내 할 일만 볼 수 있습니다.</p>
      <label class="auth-label" for="auth-email">이메일</label>
      <input type="email" id="auth-email" name="email" autocomplete="username" required>
      <label class="auth-label" for="auth-password">비밀번호 (6자 이상)</label>
      <input type="password" id="auth-password" name="password" minlength="6"
             autocomplete="current-password" required>
      <p class="error" id="auth-error" role="alert" hidden></p>
      <p class="auth-info" id="auth-info" role="status" hidden></p>
      <div class="auth-actions">
        <button type="submit" class="add-button" data-action="login">로그인</button>
        <button type="submit" class="secondary-button" data-action="signup">회원가입</button>
      </div>
    </form>
  </section>

  <div class="layout" id="app-view" hidden>
    <!-- 왼쪽 메뉴 -->
    <aside class="sidebar">
      <div class="brand">My Todo</div>
      <div class="account" id="account" hidden>
        <span class="account-email" id="account-email"></span>
        <button type="button" class="link-button" id="logout-button">로그아웃</button>
      </div>
      <nav>
        <ul class="menu" id="main-menu">
          <li><button type="button" class="menu-item" data-view="all">
            <span class="menu-icon" aria-hidden="true">☰</span>전체 할 일
          </button></li>
          <li><button type="button" class="menu-item" data-view="today">
            <span class="menu-icon" aria-hidden="true">◷</span>오늘 마감
            <span class="badge" id="today-count" hidden></span>
          </button></li>
          <li><button type="button" class="menu-item" data-view="done">
            <span class="menu-icon" aria-hidden="true">✓</span>완료한 일
          </button></li>
        </ul>
        <div class="menu-heading">카테고리</div>
        <ul class="menu" id="category-menu"></ul>
      </nav>
    </aside>

    <!-- 오른쪽 메인 화면 -->
    <main class="main">
      <header class="main-header">
        <h1 id="view-title">전체 할 일</h1>
        <p class="today-text" id="today-text"></p>
      </header>

      <!-- 할 일 등록 영역 -->
      <form class="add-form" id="add-form" autocomplete="off">
        <input type="text" id="title-input" name="title" maxlength="200"
               placeholder="할 일 추가" aria-label="할 일 제목" required>
        <select id="category-select" name="category_id" aria-label="카테고리"></select>
        <input type="date" id="due-input" name="due_date" aria-label="마감일">
        <button type="submit" class="add-button">추가</button>
      </form>
      <p class="error" id="error" role="alert" hidden></p>

      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty" id="empty" hidden></p>
    </main>
  </div>

  <template id="todo-template">
    <li class="todo">
      <label class="check">
        <input type="checkbox">
        <span class="check-box" aria-hidden="true"></span>
      </label>
      <div class="todo-body">
        <div class="todo-title"></div>
        <div class="todo-meta">
          <span class="chip"></span>
          <span class="due"></span>
        </div>
      </div>
      <button type="button" class="delete-button" aria-label="삭제" title="삭제">✕</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
